<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tensor Parallelism — Qwen3-235B-A22B on 4 GPUs</title>
<style>
  :root{
    --bg:#000000; --panel:#0f0f13; --panel2:#0a0a0d; --line:#26262c;
    --text:#e4e4e7; --dim:#8f8f98; --accent:#60a5fa;
    --g0:#22d3ee; --g1:#fbbf24; --g2:#f472b6; --g3:#4ade80;
    --ok:#4ade80; --warn:#f87171;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{max-width:100%;}
  body{background:var(--bg); color:var(--text); font-family:"SF Mono","Cascadia Code",Consolas,Menlo,monospace; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;}
  button{-webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  header{padding:14px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:20px; flex-wrap:wrap;}
  header h1{font-size:15px; font-weight:600; letter-spacing:.3px;}
  header h1 span{color:var(--dim); font-weight:400;}
  .tabs{display:flex; gap:8px; margin-left:auto;}
  .tab{padding:7px 16px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--dim); cursor:pointer; font-size:12.5px; font-family:inherit;}
  .tab.active{color:var(--text); border-color:var(--accent); background:#18181d;}
  main{flex:1; display:flex; gap:0; overflow:hidden;}
  #stage{flex:1; padding:22px; overflow:auto; display:flex; flex-direction:column; align-items:center;}
  #stageInner{width:100%; max-width:1060px;}
  aside{width:340px; min-width:300px; border-left:1px solid var(--line); padding:22px; overflow:auto; background:var(--panel2); font-size:13px; line-height:1.65;}
  aside h2{font-size:13px; color:var(--accent); margin-bottom:10px; letter-spacing:.4px;}
  aside p{margin-bottom:12px; color:var(--text);}
  aside .note{border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:6px; padding:10px 12px; margin-top:10px; color:var(--dim); font-size:12px;}
  aside .key{border:1px solid var(--line); border-left:3px solid var(--ok); border-radius:6px; padding:10px 12px; margin-top:10px; font-size:12.5px;}
  aside b{color:#fff;}
  aside code{color:var(--g1); font-size:12px;}
  footer{border-top:1px solid var(--line); padding:12px 24px; display:flex; align-items:center; gap:16px;}
  .navbtn{padding:9px 22px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; font-family:inherit; font-size:13px;}
  .navbtn.primary{background:#1d4ed8; border-color:#3b82f6;}
  .navbtn:disabled{opacity:.35; cursor:default;}
  .dots{display:flex; gap:7px; margin:0 auto;}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--line); cursor:pointer;}
  .dot.on{background:var(--accent);}
  .stepLabel{color:var(--dim); font-size:12px; min-width:110px;}
  .replay{margin-left:auto; padding:7px 14px; font-size:12px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--dim); cursor:pointer; font-family:inherit;}

  /* ---------- shared visual pieces ---------- */
  .stageTitle{font-size:16px; margin:4px 0 18px; text-align:center; color:#fff;}
  .row{display:flex; gap:18px; justify-content:center; align-items:flex-start; flex-wrap:wrap;}
  .col{display:flex; flex-direction:column; gap:10px; align-items:center;}
  .caption{font-size:11.5px; color:var(--dim); text-align:center;}
  .mtx{display:inline-grid; gap:2px; background:transparent;}
  .cell{width:30px; height:30px; display:flex; align-items:center; justify-content:center; font-size:11px; border-radius:4px; background:#1b1b21; color:#c9c9d1; transition:all .45s ease; position:relative;}
  .cell.small{width:24px; height:24px; font-size:10px;}
  .cell.hl{outline:2px solid #fff; z-index:2;}
  .cell.dimmed{opacity:.25;}
  .gpuBox{border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--panel); min-width:120px; transition:border-color .3s;}
  .gpuBox .gname{font-size:12px; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .gpuBox .gname::before{content:""; width:9px; height:9px; border-radius:2px; background:var(--gc);}
  .gpuBox.active{border-color:var(--gc); box-shadow:0 0 12px -4px var(--gc);}
  .membar{height:10px; border-radius:5px; background:#1b1b21; overflow:hidden; margin-top:6px;}
  .membar > div{height:100%; width:0%; background:var(--gc,#60a5fa); transition:width 1.2s ease;}
  .tag{display:inline-block; padding:2px 8px; border-radius:5px; font-size:10.5px; background:#1b1b21; color:var(--dim);}
  .flash{animation:flash .7s ease;}
  @keyframes flash{0%{background:#fff; color:#000;} 100%{}}
  .fadeIn{animation:fadeIn .5s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  .arrow{color:var(--dim); font-size:20px; align-self:center;}
  .eq{font-size:20px; color:var(--dim); align-self:center;}
  .okmark{color:var(--ok); font-weight:700;}
  .counter{font-size:11px; color:var(--dim);}
  .counter b{color:#fff; font-size:13px;}
  .tbarWrap{width:100%; max-width:560px;}
  .tbar{height:14px; border-radius:7px; background:#1b1b21; overflow:hidden;}
  .tbar > div{height:100%; width:0%; background:var(--accent);}
  .layerBar{height:22px; border-radius:4px; display:flex; overflow:hidden; width:230px;}
  .layerBar div{flex:1;}
  .chip{padding:6px 12px; border-radius:8px; background:#1b1b21; border:1px solid var(--line); font-size:12.5px;}
  .plus{font-size:16px; color:var(--dim); text-align:center;}
  .sumline{border-top:2px solid var(--dim); margin:4px 0;}
  .bigNote{border:1px solid var(--line); border-radius:10px; background:var(--panel); padding:14px 18px; font-size:12.5px; color:var(--dim); max-width:720px; margin:16px auto 0; line-height:1.6;}
  .bigNote b{color:#fff;}
  .modelCard{border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:20px 26px; max-width:640px; margin:0 auto;}
  .modelCard h3{font-size:15px; margin-bottom:12px; color:#fff;}
  .specGrid{display:grid; grid-template-columns:1fr 1fr; gap:8px 24px; font-size:12.5px;}
  .specGrid .k{color:var(--dim);}
  .raceTrack{display:flex; height:26px; border-radius:6px; overflow:hidden; background:#1b1b21; position:relative;}
  .raceFill{height:100%; width:0%; }
  .raceLbl{position:absolute; right:8px; top:4px; font-size:11px; color:#fff;}
  .tokOut{font-size:13px; padding:5px 12px; border-radius:8px; background:var(--ok); color:#052e12; font-weight:700; opacity:0; transition:opacity .4s;}
  .pipeBar{width:150px; height:10px; border-radius:3px;}
  .shardBar{width:64px; height:9px; border-radius:2px;}
  .layerRow{display:flex; gap:8px; align-items:center; width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .layerCell{width:70px; height:20px; border-radius:4px; flex-shrink:0; transition:all .25s;}
  .raceLane{width:100%; max-width:820px;}

  /* ---------- mobile / tablet ---------- */
  @media (max-width: 900px){
    header{padding:12px 14px; gap:10px; flex-direction:column; align-items:stretch;}
    header h1{font-size:13.5px; line-height:1.4;}
    header h1 span{display:block; font-size:11px; margin-top:3px;}
    .tabs{margin-left:0; width:100%;}
    .tab{flex:1; text-align:center; padding:10px 8px; min-height:44px; font-size:11.5px;}
    main{flex-direction:column; overflow:auto; -webkit-overflow-scrolling:touch; min-height:0;}
    #stage{padding:14px 12px 8px; overflow:visible; flex:none; min-width:0; width:100%;}
    #stageInner{max-width:100%; overflow-x:auto;}
    aside{width:100%; min-width:0; border-left:none; border-top:1px solid var(--line); padding:16px 14px 28px; overflow:visible;}
    footer{display:grid; grid-template-columns:1fr auto 1fr; grid-template-areas:"back label next" "dots dots dots" "replay replay replay"; gap:8px 10px; padding:10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); align-items:center;}
    #prevBtn{grid-area:back; justify-self:start;}
    #nextBtn{grid-area:next; justify-self:end;}
    .stepLabel{grid-area:label; min-width:0; text-align:center;}
    .dots{grid-area:dots; margin:4px 0 0; width:100%; justify-content:center; gap:10px;}
    .dot{width:12px; height:12px;}
    .replay{grid-area:replay; margin:0 auto; min-height:40px;}
    .navbtn{padding:10px 16px; min-height:44px;}
    .stageTitle{font-size:14px; line-height:1.35; margin:0 0 14px; text-align:left;}
    .row{gap:12px;}
    .cell{width:26px; height:26px; font-size:10px;}
    .cell.small{width:20px; height:20px; font-size:9px;}
    .gpuBox{min-width:0; max-width:100%;}
    .modelCard{padding:14px 16px;}
    .specGrid{grid-template-columns:1fr; gap:4px 12px;}
    .specGrid .k{margin-top:8px;}
    .specGrid .k:first-child{margin-top:0;}
    .bigNote{padding:12px 14px; font-size:12px; margin:12px 0 0; max-width:100%;}
    .layerBar{width:min(230px, 100%);}
    .tbarWrap{max-width:100%;}
    .pipeBar{width:min(150px, 42vw);}
    .layerCell{width:max(48px, 18vw);}
    .chip{padding:8px 10px;}
  }
  @media (max-width: 480px){
    .cell{width:22px; height:22px; font-size:9px;}
    .cell.small{width:18px; height:18px; font-size:8px;}
    .gpuBox{padding:10px;}
    .tab{padding:10px 6px; font-size:11px;}
    .arrow, .eq{font-size:16px;}
  }
</style>
</head>
<body>
<header>
  <h1>Tensor Parallelism <span>· Qwen3-235B-A22B on 4 GPUs · prefill &amp; time-to-first-token</span></h1>
  <div class="tabs">
    <button class="tab" id="tab1">Part 1 · Loading &amp; Sharding</button>
    <button class="tab" id="tab2">Part 2 · Prefill &amp; AllReduce</button>
  </div>
</header>
<main>
  <div id="stage"><div id="stageInner"></div></div>
  <aside id="explain"></aside>
</main>
<footer>
  <button class="navbtn" id="prevBtn">← Back</button>
  <span class="stepLabel" id="stepLabel"></span>
  <div class="dots" id="dots"></div>
  <button class="navbtn primary" id="nextBtn">Next →</button>
  <button class="replay" id="replayBtn">↻ Replay animation</button>
</footer>

<script>
/* ================= shared data & helpers ================= */
const GC = ['var(--g0)','var(--g1)','var(--g2)','var(--g3)'];
const GHEX = ['#22d3ee','#fbbf24','#f472b6','#4ade80'];
const GDARK = ['#0a3a44','#4a3407','#4a1230','#0d3a1c'];
const GNAME = ['GPU 0','GPU 1','GPU 2','GPU 3'];

// The running example: X (1x8 input activation) and W (8x8 weight matrix)
const X = [1, 2, 0, 1, 2, 1, 1, 0];
const W = Array.from({length:8},(_,r)=>Array.from({length:8},(_,c)=>((r*3 + c*5) % 7) - 3));
// full result Y = X · W   (Y[c] = Σ_r X[r]·W[r][c])
const Y = Array.from({length:8},(_,c)=>X.reduce((s,x,r)=>s + x*W[r][c],0));
// column shards: GPU i owns columns 2i, 2i+1  → produces Y[2i], Y[2i+1] exactly
// row shards: GPU i owns rows 2i, 2i+1 and X-slice [2i,2i+1] → produces a PARTIAL 1x8
const rowPartial = Array.from({length:4},(_,g)=>
  Array.from({length:8},(_,c)=> X[2*g]*W[2*g][c] + X[2*g+1]*W[2*g+1][c]));
// full prefill input: one embedding row per prompt token ("The", "cat", "sat")
const E = [X, [2,0,1,1,0,2,1,1], [0,1,2,0,1,1,2,0]];
// full prefill output: (3x8)·(8x8) = 3x8 — three independent row·W products
const YM = E.map(x => Array.from({length:8},(_,c)=>x.reduce((s,v,r)=>s + v*W[r][c],0)));

let runId = 0;                      // cancels in-flight animations on step change
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const alive = id => id === runId;
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; };

function mtx(rows, {colorOf, small, values=true, id}={}){
  const m = el('div','mtx');
  if(id) m.id = id;
  m.style.gridTemplateColumns = `repeat(${rows[0].length}, auto)`;
  rows.forEach((row,r)=>row.forEach((v,c)=>{
    const cell = el('div','cell'+(small?' small':''), values? String(v):'');
    cell.dataset.r=r; cell.dataset.c=c;
    if(colorOf){ const g = colorOf(r,c); if(g!=null){ cell.style.background=GDARK[g]; cell.style.color=GHEX[g]; } }
    m.appendChild(cell);
  }));
  return m;
}
function gpuBox(g, inner){
  const b = el('div','gpuBox'); b.style.setProperty('--gc', GC[g]);
  b.appendChild(el('div','gname', GNAME[g]));
  if(inner) b.appendChild(inner);
  return b;
}
function vecEl(v, g, opts={}){ return mtx([v], {colorOf:()=>g, ...opts}); }

/* ================= step engine ================= */
const state = {part:1, step:0};
const stage = document.getElementById('stageInner');
const explain = document.getElementById('explain');

function render(){
  runId++;
  const steps = PARTS[state.part];
  const s = steps[state.step];
  stage.innerHTML=''; explain.innerHTML='';
  stage.appendChild(el('div','stageTitle', s.title));
  explain.innerHTML = s.text;
  document.getElementById('tab1').classList.toggle('active', state.part===1);
  document.getElementById('tab2').classList.toggle('active', state.part===2);
  document.getElementById('stepLabel').textContent = `Part ${state.part} · Step ${state.step+1}/${steps.length}`;
  const dots = document.getElementById('dots'); dots.innerHTML='';
  steps.forEach((_,i)=>{ const d=el('div','dot'+(i===state.step?' on':'')); d.onclick=()=>{state.step=i; render();}; dots.appendChild(d); });
  document.getElementById('prevBtn').disabled = (state.part===1 && state.step===0);
  const last = (state.part===2 && state.step===steps.length-1);
  document.getElementById('nextBtn').textContent = last ? 'Done ✓' : 'Next →';
  document.getElementById('nextBtn').disabled = last;
  const body = el('div');
  stage.appendChild(body);
  s.setup(body, runId);
}
document.getElementById('nextBtn').onclick = ()=>{
  const steps = PARTS[state.part];
  if(state.step < steps.length-1){ state.step++; }
  else if(state.part===1){ state.part=2; state.step=0; }
  render();
};
document.getElementById('prevBtn').onclick = ()=>{
  if(state.step>0){ state.step--; }
  else if(state.part===2){ state.part=1; state.step=PARTS[1].length-1; }
  render();
};
document.getElementById('replayBtn').onclick = render;
document.getElementById('tab1').onclick = ()=>{state.part=1; state.step=0; render();};
document.getElementById('tab2').onclick = ()=>{state.part=2; state.step=0; render();};

/* ================= PART 1 ================= */
const P1 = [];

/* ---- 1.1 the model ---- */
P1.push({
  title:'The model: Qwen3-235B-A22B — too big for one GPU',
  text:`<h2>Why split at all?</h2>
    <p><b>235B parameters.</b> In BF16 (2 bytes each) that is ~<b>470 GB of weights</b> — an H100 has 80 GB. The model physically cannot live on one GPU.</p>
    <p>So we take <b>4 GPUs</b> and give each one a piece. The whole question of this simulation: <b>which piece?</b></p>
    <div class="note"><b>Reality check:</b> this is a MoE model — 235B total but only <b>22B active</b> per token (8 of 128 experts fire). Production setups often place experts via <i>expert parallelism</i>. Here we use dense <b>tensor parallelism</b> on the weight matrices, because that's the mental model that explains prefill speed — and it's exactly how the attention weights are split in practice.</div>`,
  setup(body){
    const card = el('div','modelCard fadeIn');
    card.appendChild(el('h3','','Qwen3-235B-A22B'));
    const g = el('div','specGrid');
    [['Total parameters','235 B'],['Active per token','22 B (MoE: 8 of 128 experts)'],
     ['Transformer layers','94'],['Hidden size','4096'],
     ['Weights in BF16','~470 GB'],['One H100','80 GB  ✗ does not fit']]
      .forEach(([k,v])=>{ g.appendChild(el('div','k',k)); g.appendChild(el('div','',v)); });
    card.appendChild(g);
    body.appendChild(card);
    const row = el('div','row'); row.style.marginTop='26px';
    for(let i=0;i<4;i++){
      const inner = el('div');
      inner.appendChild(el('div','caption','80–141 GB memory'));
      const mb = el('div','membar'); mb.appendChild(el('div'));
      inner.appendChild(mb);
      row.appendChild(gpuBox(i, inner));
    }
    body.appendChild(row);
    body.appendChild(el('div','bigNote','470 GB of weights, 4 empty GPUs. <b>How do we cut the model?</b> There are two very different answers → next step.'));
  }
});

/* ---- 1.2 wrong mental model: pipeline ---- */
P1.push({
  title:'Cut #1 — whole layers per GPU (pipeline parallelism). NOT what we want.',
  text:`<h2>The intuitive (wrong-for-us) cut</h2>
    <p>The obvious idea: 94 layers, 4 GPUs → GPU 0 takes layers 1–24, GPU 1 takes 25–47, and so on. This exists — it's called <b>pipeline parallelism</b>.</p>
    <p>But watch the animation: while your prompt is inside GPU 0's layers, <b>GPUs 1–3 sit idle</b>. For a single request, every layer is still computed at <i>full size</i> by <i>one</i> GPU. Time-to-first-token barely improves.</p>
    <div class="key"><b>Your instinct was right:</b> we do NOT divide layers across GPUs. We divide <b>the weights inside every layer</b>. That's the next step.</div>`,
  setup(body, id){
    const row = el('div','row');
    const boxes=[];
    for(let g=0;g<4;g++){
      const inner = el('div','col');
      const stack = el('div'); stack.style.display='flex'; stack.style.flexDirection='column'; stack.style.gap='3px';
      for(let l=0;l<6;l++){
        const bar = el('div','pipeBar'); bar.style.cssText=`background:${GDARK[g]};border:1px solid ${GHEX[g]}33`;
        stack.appendChild(bar);
      }
      inner.appendChild(stack);
      inner.appendChild(el('div','caption',`layers ${g*24+1}–${Math.min((g+1)*24,94)}<br>(full weights)`));
      const st = el('div','tag','idle'); inner.appendChild(st);
      const b = gpuBox(g, inner); boxes.push({b, st});
      row.appendChild(b);
      if(g<3) row.appendChild(el('div','arrow','→'));
    }
    body.appendChild(row);
    body.appendChild(el('div','bigNote','A prompt travels <b>left to right</b>. Only one GPU works at a time on this request — the others wait. 4 GPUs, ~1 GPU of speed for your token.'));
    (async()=>{
      while(alive(id)){
        for(let g=0; g<4 && alive(id); g++){
          boxes.forEach((x,i)=>{ x.b.classList.toggle('active', i===g); x.st.textContent = i===g?'COMPUTING':'idle'; x.st.style.color = i===g?GHEX[g]:'var(--dim)'; });
          await sleep(850);
        }
      }
    })();
  }
});

/* ---- 1.3 right mental model: tensor parallel ---- */
P1.push({
  title:'Cut #2 — every layer sliced across ALL GPUs (tensor parallelism)',
  text:`<h2>The cut we actually use</h2>
    <p>Each of the 94 layers is <b>split four ways</b>. Every GPU holds a slice of layer 1, a slice of layer 2 … a slice of layer 94.</p>
    <p>No GPU has any complete layer. Every GPU has a piece of <i>every</i> layer.</p>
    <p>Consequence: when the prompt hits layer 1, <b>all four GPUs work on layer 1 at the same time</b>. Then all four work on layer 2. No one idles.</p>
    <div class="key">Each layer bar here is one transformer layer; the four colors are the four GPUs' slices of it.</div>`,
  setup(body, id){
    const col = el('div','col');
    const stack = el('div'); stack.style.cssText='display:flex;flex-direction:column;gap:4px;align-items:center;';
    const barEls=[];
    for(let l=0;l<10;l++){
      const bar = el('div','layerBar');
      for(let g=0;g<4;g++){ const seg=el('div'); seg.style.background=GDARK[g]; seg.style.borderTop=`2px solid ${GHEX[g]}`; bar.appendChild(seg); }
      stack.appendChild(bar); barEls.push(bar);
      if(l===7){ stack.appendChild(el('div','caption','⋮  (94 layers total)')); }
    }
    col.appendChild(el('div','caption','the model — every layer split 4 ways'));
    col.appendChild(stack);
    body.appendChild(col);
    const row = el('div','row'); row.style.marginTop='24px';
    for(let g=0;g<4;g++){
      const inner = el('div');
      inner.appendChild(el('div','caption',`¼ of layer 1<br>¼ of layer 2<br>⋮<br>¼ of layer 94`));
      const mb = el('div','membar'); const fill = el('div'); mb.appendChild(fill); inner.appendChild(mb);
      inner.appendChild(el('div','caption','~118 GB / GPU'));
      row.appendChild(gpuBox(g, inner));
      setTimeout(()=>{ if(alive(id)) fill.style.width='83%'; }, 300);
    }
    body.appendChild(row);
    body.appendChild(el('div','bigNote','470 GB ÷ 4 = <b>~118 GB per GPU</b>. (Even that beats 80 GB — real 4-GPU rigs use FP8 on H200 141 GB cards, or quantize. The <i>splitting logic</i> is identical.)'));
  }
});

/* ---- 1.4 the shard (merged with layer contents) ---- */
P1.push({
  title:'What gets sliced: a layer stores a few weight grids — here one becomes 4 shards',
  text:`<h2>What is actually IN a layer — and in a shard?</h2>
    <p>Nothing is running yet; we are still <i>loading</i>. What a layer <b>stores</b> is a handful of weight matrices — <code>W_Q, W_K, W_V, W_O</code> (attention) and <code>W_up, W_down</code> (FFN). Each is just <b>a grid of numbers</b>: a 4096×4096 one holds 16.7 million of them. The rest of the layer (norms, softmax, activation) stores ~nothing. <i>What these grids do with an input is Part 2's job — for loading, only their size matters.</i></p>
    <p>Such grids don't fit on a screen, so one <b>8×8 stand-in</b> represents any of them — with real numbers that stay fixed for the whole simulation.</p>
    <p>A shard is nothing exotic: <b>a rectangular block of those numbers</b>. Cut by columns: GPU 0 gets columns 0–1, GPU 1 gets 2–3, and so on — an <b>8×2 block</b>, 16 of the 64 numbers, per GPU. The numbers don't change, they just <i>move house</i>; side by side the four blocks would be W again, bit for bit.</p>
    <div class="note">There is a second cut — <b>by rows</b> — and the difference between the two decides whether the join is a <i>concat</i> or an <i>AllReduce</i>. That's the punchline of Part 2, step 5.</div>

    ar.appendChild(stackBox); ar.appendChild(sum ? check : check);
    body.appendChild(ar);
    const foot = el('div','bigNote','After AllReduce, <b>all four GPUs hold the identical full Y</b> — exactly what they need to broadcast-start the next layer. Cost: one exchange of a tiny 1×8 (really 1×4096) vector over NVLink, vs. re-doing 16.7M multiply-adds. Cheap — but not free. This is the "communication tax" you\'ll see in the TTFT race.');
    body.appendChild(foot);
    (async()=>{
      await sleep(600); if(!alive(id)) return;
      // compute partials in parallel
      for(let c=0;c<8;c++){
        if(!alive(id)) return;
        parts.forEach((pm,g)=>{
          const cell = pm.querySelectorAll('.cell')[c];
          cell.textContent = rowPartial[g][c];
          cell.style.background=GDARK[g]; cell.style.color=GHEX[g];
        });
        await sleep(160);
      }
      await sleep(500); if(!alive(id)) return;
      // fly partials into the stack
      for(let g=0;g<4;g++){
        if(!alive(id)) return;
        stackRows[g].querySelectorAll('.cell').forEach((cell,c)=>{
          cell.textContent = rowPartial[g][c];
          cell.style.background=GDARK[g]; cell.style.color=GHEX[g];
        });
        stackRows[g].classList.add('fadeIn');
        await sleep(300);
      }
      await sleep(400); if(!alive(id)) return;
      sum.querySelectorAll('.cell').forEach((cell,c)=>{
        cell.textContent = Y[c]; cell.style.background='#2c2c35'; cell.style.color='#fff'; cell.classList.add('flash');
      });
      check.innerHTML = `same Y again <span class="okmark">✓</span> — [${Y.join(' ')}] · four shard-matmuls ≡ one big matmul`;
    })();
  }
});

/* ---- 2.5 through the layers ---- */
P2.push({
  title:'Prefill = this rhythm, 94 times: compute in parallel → one AllReduce → next layer',
  text:`<h2>The full forward pass</h2>
    <p>Layer 1's output (after its AllReduce, identical on all GPUs) <b>is</b> layer 2's input. No data needs to "move to the next GPU" — the next layer's shards are already sitting on the same four GPUs.</p>
    <p>So prefill is a drumbeat:</p>
    <p><b>compute ¼-size matmuls on 4 GPUs → AllReduce → compute → AllReduce → …</b> ×94 layers.</p>
    <p>The green flashes are the four GPUs working simultaneously; the white pulse is the AllReduce sync between layers.</p>`,
  setup(body, id){
    const chain = el('div','col');
    const rows=[];
    const wrap = el('div'); wrap.style.cssText='display:flex;flex-direction:column;gap:8px;';
    for(let l=0;l<8;l++){
      const r = el('div','layerRow');
      r.appendChild(el('div','caption',`L${l+1}`)).style.minWidth='30px';
      const gcells=[];
      for(let g=0;g<4;g++){
        const c = el('div','layerCell'); c.style.cssText+=`background:${GDARK[g]};border:1px solid ${GHEX[g]}44;`;
        r.appendChild(c); gcells.push(c);
      }
      const sync = el('div','tag','AllReduce'); sync.style.transition='all .25s';
      r.appendChild(sync);
      wrap.appendChild(r);
      rows.push({gcells, sync});
    }
    wrap.appendChild(el('div','caption','⋮ continues to layer 94 ⋮'));
    chain.appendChild(wrap);
    body.appendChild(chain);
    const out = el('div','col'); out.style.marginTop='14px';
    const tok = el('div','tokOut','first token → "Sure"');
    out.appendChild(tok);
    body.appendChild(out);
    (async()=>{
      await sleep(400);
      for(let l=0;l<8;l++){
        if(!alive(id)) return;
        rows[l].gcells.forEach((c,g)=>{ c.style.boxShadow=`0 0 10px -2px ${GHEX[g]}`; c.style.borderColor=GHEX[g]; });
        await sleep(420); if(!alive(id)) return;
        rows[l].gcells.forEach(c=>{ c.style.boxShadow='none'; });
        rows[l].sync.style.background='#fff'; rows[l].sync.style.color='#000';
        await sleep(200); if(!alive(id)) return;
        rows[l].sync.style.background=''; rows[l].sync.style.color='';
      }
      if(!alive(id)) return;
      tok.style.opacity='1';
    })();
  }
});

/* ---- 2.6 TTFT race ---- */
P2.push({
  title:'The payoff: time-to-first-token, 1 GPU vs 4 GPUs',
  text:`<h2>Race through 94 layers</h2>
    <p>Per layer (per weight matrix, per token): the 1-GPU lane pays <b>4 units of math</b>. The 4-GPU lane pays <b>1 unit of math + ~0.25 units of AllReduce tax</b>.</p>
    <p>Over 94 layers: 376 units vs ~117 units → <b>~3.2× faster to the first token</b>, not 4×. The gap IS the communication cost — visible as the amber slivers in the bottom lane.</p>
    <div class="key"><b>The complete mental model:</b><br>① every layer's weight matrices are sliced across all GPUs (a shard = a block of raw weight numbers);<br>② prefill broadcasts the input, each GPU does a ¼-size matmul — parallel wall-clock win;<br>③ column-cut pieces <i>concatenate</i>, row-cut partials <i>AllReduce-sum</i> — either way, provably identical to the one big matmul;<br>④ one AllReduce per block, 94 layers of drumbeat, first token arrives ~3× sooner.</div>
    <div class="note">Caveat kept honest: this model is MoE, so its FFN experts are usually split by <i>expert</i> parallelism in production, attention by tensor parallelism. And 470 GB BF16 needs H200-class cards or FP8. Neither changes the logic you just watched.</div>`,
  setup(body, id){
    const wrap = el('div','col'); wrap.style.gap='26px';
    function lane(label, colorHtml){
      const c = el('div','raceLane');
      c.appendChild(el('div','caption',label)).style.textAlign='left';
      const t = el('div','raceTrack');
      c.appendChild(t);
      const timer = el('div','counter','elapsed: <b>0</b> units');
      c.appendChild(timer);
      const tok = el('div','tokOut','FIRST TOKEN ✓'); tok.style.marginTop='6px';
      c.appendChild(tok);
      return {c, t, timer, tok};
    }
    const l1 = lane('1 GPU — full-size matmuls, no communication');
    const l4 = lane('4 GPUs — ¼-size matmuls (blue) + AllReduce tax (amber)');
    wrap.appendChild(l1.c); wrap.appendChild(l4.c);
    // build segmented fills
    const f1 = el('div','raceFill'); f1.style.background='#3b82f6'; l1.t.appendChild(f1);
    const f4wrap = el('div'); f4wrap.style.cssText='display:flex;height:100%;width:0%;overflow:hidden;'; l4.t.appendChild(f4wrap);
    for(let i=0;i<20;i++){
      const m = el('div'); m.style.cssText='height:100%;flex:4;background:#3b82f6;';
      const a = el('div'); a.style.cssText='height:100%;flex:1;background:#fbbf24;';
      f4wrap.appendChild(m); f4wrap.appendChild(a);
    }
    const res = el('div','bigNote','');
    wrap.appendChild(res);
    body.appendChild(wrap);
    const T1=376, T4=117.5, DUR=6000; // animate: 1 unit = DUR/T1 ms
    (async()=>{
      await sleep(500); if(!alive(id)) return;
      const t0 = performance.now();
      const iv = setInterval(()=>{
        if(!alive(id)){ clearInterval(iv); return; }
        const u = (performance.now()-t0) / (DUR/T1);
        const u1 = Math.min(u, T1), u4 = Math.min(u, T4);
        f1.style.width = (u1/T1*100)+'%';
        f4wrap.style.width = (u4/T4*100)+'%';
        l1.timer.innerHTML = `elapsed: <b>${Math.round(u1)}</b> units`;
        l4.timer.innerHTML = `elapsed: <b>${Math.round(u4)}</b> units` + (u4>=T4?' — done':'');
        if(u4>=T4) l4.tok.style.opacity='1';
        if(u1>=T1){ l1.tok.style.opacity='1'; clearInterval(iv);
          res.innerHTML = `TTFT: <b>376 units → 117.5 units</b> = <b>3.2× faster</b>. Not 4× — the amber AllReduce tax is real. Bigger prompts amortize it better; slower interconnects (PCIe vs NVLink) make it worse.`;
        }
      }, 40);
    })();
  }
});

const PARTS = {1:P1, 2:P2};
render();
</script>
