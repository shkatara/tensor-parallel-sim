<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tensor Parallelism: Qwen3-235B-A22B on 4 GPUs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --serif:"Newsreader",Georgia,"Times New Roman",serif;
  }
  /* ---------- light: warm printed paper ---------- */
  html[data-theme="light"]{
    color-scheme:light;
    --bg:#f1eee4; --panel:#fbf9f3; --panel2:#e8e4d6; --line:#cec8b5; --line2:#aca48c;
    --text:#191813; --dim:#6b6555;
    --accent:#a8401a; --onAccent:#fffaf5;
    --ink:#191813; --onInk:#fbf9f3;
    --g0:#0d6c78; --g1:#8a5c00; --g2:#a12c5c; --g3:#3c6a1e;
    --t0:#d2e7e9; --t1:#eee2c2; --t2:#f3dae3; --t3:#deeacf;
    --b0:#0d6c7866; --b1:#8a5c0066; --b2:#a12c5c66; --b3:#3c6a1e66;
    --ok:#2e6b28; --onOk:#fffaf5; --warn:#a83527;
    --grid:rgba(25,24,19,.045);
    --warnWash:rgba(168,53,39,.05); --okWash:rgba(46,107,40,.05); --codeWash:rgba(138,92,0,.08);
  }
  /* ---------- dark: same press, inked plate ---------- */
  html[data-theme="dark"]{
    color-scheme:dark;
    --bg:#14140f; --panel:#1d1d16; --panel2:#100f0b; --line:#34332a; --line2:#514e41;
    --text:#eae5d6; --dim:#98927f;
    --accent:#e07a45; --onAccent:#1a1006;
    --ink:#eae5d6; --onInk:#14140f;
    --g0:#48bec9; --g1:#d9a72b; --g2:#e37ba6; --g3:#8ac653;
    --t0:#0d3439; --t1:#3a2d08; --t2:#3b1a29; --t3:#1d3312;
    --b0:#48bec988; --b1:#d9a72b88; --b2:#e37ba688; --b3:#8ac65388;
    --ok:#6bb84f; --onOk:#0d1a08; --warn:#e2705c;
    --grid:rgba(234,229,214,.035);
    --warnWash:rgba(226,112,92,.07); --okWash:rgba(107,184,79,.07); --codeWash:rgba(217,167,43,.1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{max-width:100%;}
  body{
    background-color:var(--bg); color:var(--text); font-family:var(--mono);
    background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:24px 24px;
    min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  button{-webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  header{padding:14px 24px; border-bottom:1px solid var(--line2); display:flex; align-items:center; gap:20px; flex-wrap:wrap; background:var(--panel); position:relative;}
  header h1{font-family:var(--serif); font-size:21px; font-weight:600; letter-spacing:0;}
  header h1 span{color:var(--dim); font-weight:400; font-size:15px; font-style:italic;}
  .tabs{display:flex; gap:6px; margin-left:auto;}
  .themeBtn{width:34px; height:34px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border:1px solid var(--line2); border-radius:2px; background:transparent; color:var(--dim); cursor:pointer; font-family:var(--mono); font-size:15px; line-height:1; padding-bottom:1px; transition:color .2s, border-color .2s;}
  .themeBtn:hover{color:var(--accent); border-color:var(--accent);}
  .tab{padding:7px 14px; border:1px solid var(--line2); border-radius:2px; background:transparent; color:var(--dim); cursor:pointer; font-size:11px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.08em;}
  .tab:hover{color:var(--text); border-color:var(--ink);}
  .tab.active{color:var(--onInk); border-color:var(--ink); background:var(--ink);}
  main{flex:1; display:flex; gap:0; overflow:hidden;}
  #stage{flex:1; padding:26px 22px; overflow:auto; display:flex; flex-direction:column; align-items:center;}
  #stageInner{width:100%; max-width:1060px;}
  aside{width:352px; min-width:310px; border-left:1px solid var(--line2); padding:24px; overflow:auto; background:var(--panel2); font-family:var(--serif); font-size:15.5px; line-height:1.62;}
  aside h2{font-family:var(--mono); font-size:11px; font-weight:700; color:var(--accent); margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--line); text-transform:uppercase; letter-spacing:.12em;}
  aside p{margin-bottom:12px; color:var(--text);}
  aside .note{border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:2px; padding:11px 13px; margin-top:12px; color:var(--dim); font-size:14px; background:var(--warnWash);}
  aside .key{border:1px solid var(--line); border-left:3px solid var(--ok); border-radius:2px; padding:11px 13px; margin-top:12px; font-size:14.5px; background:var(--okWash);}
  aside b{color:var(--text); font-weight:600;}
  aside code{font-family:var(--mono); color:var(--g1); font-size:12.5px; background:var(--codeWash); padding:1px 4px; border-radius:2px;}
  footer{border-top:1px solid var(--line2); padding:12px 24px; display:flex; align-items:center; gap:16px; background:var(--panel);}
  .navbtn{padding:9px 20px; border-radius:2px; border:1px solid var(--line2); background:transparent; color:var(--text); cursor:pointer; font-family:var(--mono); font-size:12px; text-transform:uppercase; letter-spacing:.06em;}
  .navbtn:hover:not(:disabled){border-color:var(--ink);}
  .navbtn.primary{background:var(--accent); border-color:var(--accent); color:var(--onAccent);}
  .navbtn:disabled{opacity:.3; cursor:default;}
  .dots{display:flex; gap:6px; margin:0 auto;}
  .dot{width:10px; height:10px; border-radius:1px; background:transparent; border:1px solid var(--line2); cursor:pointer;}
  .dot.on{background:var(--accent); border-color:var(--accent);}
  .stepLabel{color:var(--dim); font-size:11px; min-width:120px; text-transform:uppercase; letter-spacing:.08em;}
  .replay{margin-left:auto; padding:7px 12px; font-size:11px; border-radius:2px; border:1px dashed var(--line2); background:transparent; color:var(--dim); cursor:pointer; font-family:var(--mono);}
  .replay:hover{color:var(--accent); border-color:var(--accent);}

  /* ---------- shared visual pieces ---------- */
  .stageTitle{font-family:var(--serif); font-size:22px; font-weight:500; line-height:1.3; margin:0 0 22px; text-align:center; color:var(--text);}
  .row{display:flex; gap:18px; justify-content:center; align-items:flex-start; flex-wrap:wrap;}
  .col{display:flex; flex-direction:column; gap:10px; align-items:center;}
  .caption{font-size:11px; color:var(--dim); text-align:center; line-height:1.5;}
  .mtx{display:inline-grid; gap:3px; background:transparent;}
  .cell{width:30px; height:30px; display:flex; align-items:center; justify-content:center; font-size:11px; border-radius:1px; background:var(--panel); border:1px solid var(--line); color:var(--text); transition:all .45s ease; position:relative;}
  .cell.small{width:24px; height:24px; font-size:10px;}
  .cell.hl{outline:2px solid var(--ink); outline-offset:1px; z-index:2;}
  .cell.dimmed{opacity:.22;}
  .gpuBox{border:1px solid var(--line2); border-radius:2px; padding:12px; background:var(--panel); min-width:120px; transition:box-shadow .3s, border-color .3s;}
  .gpuBox .gname{font-size:10.5px; font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:6px; text-transform:uppercase; letter-spacing:.1em;}
  .gpuBox .gname::before{content:""; width:9px; height:9px; border-radius:0; background:var(--gc);}
  .gpuBox.active{border-color:var(--gc); box-shadow:4px 4px 0 -1px var(--gc);}
  .membar{height:10px; border-radius:1px; background:var(--bg); border:1px solid var(--line); overflow:hidden; margin-top:6px;}
  .membar > div{height:100%; width:0%; background:var(--gc,var(--accent)); transition:width 1.2s ease;}
  .tag{display:inline-block; padding:2px 7px; border-radius:1px; font-size:9.5px; background:var(--bg); border:1px solid var(--line); color:var(--dim); text-transform:uppercase; letter-spacing:.08em;}
  .flash{animation:flash .7s ease;}
  @keyframes flash{0%{background:var(--accent); color:var(--onAccent); border-color:var(--accent);} 100%{}}
  .fadeIn{animation:fadeIn .5s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  .arrow{color:var(--dim); font-size:18px; align-self:center;}
  .eq{font-size:20px; color:var(--dim); align-self:center;}
  .okmark{color:var(--ok); font-weight:700;}
  .counter{font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em;}
  .counter b{color:var(--text); font-size:13px;}
  .tbarWrap{width:100%; max-width:560px;}
  .tbar{height:14px; border-radius:1px; background:var(--panel); border:1px solid var(--line); overflow:hidden;}
  .tbar > div{height:100%; width:0%; background:var(--accent);}
  .layerBar{height:22px; border-radius:1px; display:flex; overflow:hidden; width:230px;}
  .layerBar div{flex:1;}
  .chip{padding:6px 11px; border-radius:2px; background:var(--panel); border:1px solid var(--line2); font-size:11.5px;}
  .plus{font-size:15px; color:var(--dim); text-align:center;}
  .sumline{border-top:2px solid var(--ink); margin:5px 0;}
  .bigNote{font-family:var(--serif); border-left:3px solid var(--accent); background:var(--panel); padding:13px 18px; font-size:15px; color:var(--dim); max-width:720px; margin:20px auto 0; line-height:1.6;}
  .bigNote b{color:var(--text); font-weight:600;}
  .modelCard{border:1px solid var(--line2); border-radius:2px; background:var(--panel); padding:22px 26px; max-width:640px; margin:0 auto; box-shadow:5px 5px 0 -1px var(--line);}
  .modelCard h3{font-family:var(--serif); font-size:20px; font-weight:600; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--line); color:var(--text);}
  .specGrid{display:grid; grid-template-columns:1fr 1fr; gap:9px 24px; font-size:12px;}
  .specGrid .k{color:var(--dim); text-transform:uppercase; font-size:10.5px; letter-spacing:.06em;}
  .raceTrack{display:flex; height:26px; border-radius:1px; overflow:hidden; background:var(--panel); border:1px solid var(--line2); position:relative;}
  .raceFill{height:100%; width:0%; }
  .raceLbl{position:absolute; right:8px; top:4px; font-size:11px; color:var(--text);}
  .tokOut{font-size:11px; padding:6px 12px; border-radius:1px; background:var(--ok); color:var(--onOk); font-weight:700; opacity:0; transition:opacity .4s; text-transform:uppercase; letter-spacing:.1em;}
  .pipeBar{width:150px; height:10px; border-radius:1px;}
  .shardBar{width:64px; height:9px; border-radius:1px;}
  .layerRow{display:flex; gap:8px; align-items:center; width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .layerCell{width:70px; height:20px; border-radius:1px; flex-shrink:0; transition:all .25s;}
  .raceLane{width:100%; max-width:820px;}

  /* ---------- slicing visual animations ---------- */
  .sliceContainer{display:flex; gap:3px; transition:gap .65s cubic-bezier(.34,1.4,.64,1); background:transparent; position:relative; padding:4px;}
  .statusBadge{font-family:var(--mono); font-size:11px; padding:6px 14px; border-radius:2px; background:var(--panel); border:1px solid var(--line2); color:var(--text); text-transform:uppercase; letter-spacing:.06em; min-height:30px; display:flex; align-items:center; justify-content:center; transition:all .3s;}
  .statusBadge.active{border-color:var(--accent); color:var(--accent); background:var(--warnWash); box-shadow:0 0 8px rgba(168,64,26,.15);}

  /* ---------- mobile / tablet ---------- */
  @media (max-width: 900px){
    header{padding:12px 14px; gap:10px; flex-direction:column; align-items:stretch;}
    header h1{font-size:18px; line-height:1.3; padding-right:46px;}
    header h1 span{display:block; font-size:13px; margin-top:2px;}
    .themeBtn{position:absolute; top:12px; right:14px;}
    .tabs{margin-left:0; width:100%;}
    .tab{flex:1; text-align:center; padding:10px 6px; min-height:44px; font-size:9.5px; letter-spacing:.05em;}
    main{flex-direction:column; overflow:auto; -webkit-overflow-scrolling:touch; min-height:0;}
    #stage{padding:14px 12px 8px; overflow:visible; flex:none; min-width:0; width:100%;}
    #stageInner{max-width:100%; overflow-x:auto;}
    aside{width:100%; min-width:0; border-left:none; border-top:1px solid var(--line2); padding:16px 14px 28px; overflow:visible; font-size:15px;}
    footer{display:grid; grid-template-columns:1fr auto 1fr; grid-template-areas:"back label next" "dots dots dots" "replay replay replay"; gap:8px 10px; padding:10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); align-items:center;}
    #prevBtn{grid-area:back; justify-self:start;}
    #nextBtn{grid-area:next; justify-self:end;}
    .stepLabel{grid-area:label; min-width:0; text-align:center;}
    .dots{grid-area:dots; margin:4px 0 0; width:100%; justify-content:center; gap:10px;}
    .dot{width:12px; height:12px;}
    .replay{grid-area:replay; margin:0 auto; min-height:40px;}
    .navbtn{padding:10px 16px; min-height:44px;}
    .stageTitle{font-size:18px; line-height:1.3; margin:0 0 16px; text-align:left;}
    .row{gap:12px;}
    .cell{width:26px; height:26px; font-size:10px;}
    .cell.small{width:20px; height:20px; font-size:9px;}
    .gpuBox{min-width:0; max-width:100%;}
    .modelCard{padding:14px 16px;}
    .specGrid{grid-template-columns:1fr; gap:4px 12px;}
    .specGrid .k{margin-top:8px;}
    .specGrid .k:first-child{margin-top:0;}
    .bigNote{padding:11px 14px; font-size:14.5px; margin:14px 0 0; max-width:100%;}
    .layerBar{width:min(230px, 100%);}
    .tbarWrap{max-width:100%;}
    .pipeBar{width:min(150px, 42vw);}
    .layerCell{width:max(48px, 18vw);}
    .chip{padding:8px 10px;}
  }
  @media (max-width: 480px){
    .cell{width:22px; height:22px; font-size:9px;}
    .cell.small{width:18px; height:18px; font-size:8px;}
    .gpuBox{padding:10px;}
    .tab{padding:10px 6px; font-size:11px;}
    .arrow, .eq{font-size:16px;}
  }
</style>
<script>
/* runs before first paint so the saved theme never flashes the wrong colours */
(function(){
  let saved = null;
  try{ saved = localStorage.getItem('tp-theme'); }catch(e){}
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = (saved === 'dark' || saved === 'light') ? saved : (prefersDark ? 'dark' : 'light');
})();
</script>
</head>
<body>
<header>
  <h1>Tensor Parallelism <span>· Qwen3-235B-A22B on 4 GPUs · prefill &amp; time-to-first-token</span></h1>
  <div class="tabs">
    <button class="tab" id="tab1">Part 1 · Loading &amp; Sharding</button>
    <button class="tab" id="tab2">Part 2 · Prefill &amp; AllReduce</button>
  </div>
  <button class="themeBtn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle light or dark theme"></button>
</header>
<main>
  <div id="stage"><div id="stageInner"></div></div>
  <aside id="explain"></aside>
</main>
<footer>
  <button class="navbtn" id="prevBtn">← Back</button>
  <span class="stepLabel" id="stepLabel"></span>
  <div class="dots" id="dots"></div>
  <button class="navbtn primary" id="nextBtn">Next →</button>
  <button class="replay" id="replayBtn">↻ Replay animation</button>
</footer>

<script>
/* ================= shared data & helpers ================= */
/* every colour below is a CSS variable reference, so the light/dark toggle
   restyles already-rendered cells without re-running any animation */
const GC = ['var(--g0)','var(--g1)','var(--g2)','var(--g3)'];   // solid GPU colour
const GT = ['var(--t0)','var(--t1)','var(--t2)','var(--t3)'];   // pale fill
const GB = ['var(--b0)','var(--b1)','var(--b2)','var(--b3)'];   // fill border
const GNAME = ['GPU 0','GPU 1','GPU 2','GPU 3'];
const INK = 'var(--ink)', ONINK = 'var(--onInk)';
const paint = (cell, g) => { cell.style.background=GT[g]; cell.style.color=GC[g]; cell.style.borderColor=GB[g]; };
const paintInk = cell => { cell.style.background=INK; cell.style.color=ONINK; cell.style.borderColor=INK; };

// The running example: X (1x8 input activation) and W (8x8 weight matrix)
const X = [1, 2, 0, 1, 2, 1, 1, 0];
const W = Array.from({length:8},(_,r)=>Array.from({length:8},(_,c)=>((r*3 + c*5) % 7) - 3));
// full prefill input: one embedding row per prompt token ("The", "cat", "sat")
const E = [X, [2,0,1,1,0,2,1,1], [0,1,2,0,1,1,2,0]];
// full prefill output: (3x8)·(8x8) = 3x8: three independent row·W products
const YM = E.map(x => Array.from({length:8},(_,c)=>x.reduce((s,v,r)=>s + v*W[r][c],0)));
// row shards: GPU g owns rows 2g, 2g+1 and X-slice cols [2g, 2g+1] -> produces a PARTIAL 3x8 matrix for all 3 prompt tokens
const rowPartialM = Array.from({length:4},(_,g)=>
  E.map(x => Array.from({length:8},(_,c)=> x[2*g]*W[2*g][c] + x[2*g+1]*W[2*g+1][c])));

let runId = 0;                      // cancels in-flight animations on step change
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const alive = id => id === runId;
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; };

function mtx(rows, {colorOf, small, values=true, id}={}){
  const m = el('div','mtx');
  if(id) m.id = id;
  m.style.gridTemplateColumns = `repeat(${rows[0].length}, auto)`;
  rows.forEach((row,r)=>row.forEach((v,c)=>{
    const cell = el('div','cell'+(small?' small':''), values? String(v):'');
    cell.dataset.r=r; cell.dataset.c=c;
    if(colorOf){ const g = colorOf(r,c); if(g!=null){ paint(cell,g); } }
    m.appendChild(cell);
  }));
  return m;
}
function gpuBox(g, inner){
  const b = el('div','gpuBox'); b.style.setProperty('--gc', GC[g]);
  b.appendChild(el('div','gname', GNAME[g]));
  if(inner) b.appendChild(inner);
  return b;
}
function vecEl(v, g, opts={}){ return mtx([v], {colorOf:()=>g, ...opts}); }

/* ================= step engine ================= */
const state = {part:1, step:0};
const stage = document.getElementById('stageInner');
const explain = document.getElementById('explain');

function render(){
  runId++;
  const steps = PARTS[state.part];
  const s = steps[state.step];
  stage.innerHTML=''; explain.innerHTML='';
  stage.appendChild(el('div','stageTitle', s.title));
  explain.innerHTML = s.text;
  document.getElementById('tab1').classList.toggle('active', state.part===1);
  document.getElementById('tab2').classList.toggle('active', state.part===2);
  document.getElementById('stepLabel').textContent = `Part ${state.part} · Step ${state.step+1}/${steps.length}`;
  const dots = document.getElementById('dots'); dots.innerHTML='';
  steps.forEach((_,i)=>{ const d=el('div','dot'+(i===state.step?' on':'')); d.onclick=()=>{state.step=i; render();}; dots.appendChild(d); });
  document.getElementById('prevBtn').disabled = (state.part===1 && state.step===0);
  const last = (state.part===2 && state.step===steps.length-1);
  document.getElementById('nextBtn').textContent = last ? 'Done ✓' : 'Next →';
  document.getElementById('nextBtn').disabled = last;
  const body = el('div');
  stage.appendChild(body);
  s.setup(body, runId);
}
document.getElementById('nextBtn').onclick = ()=>{
  const steps = PARTS[state.part];
  if(state.step < steps.length-1){ state.step++; }
  else if(state.part===1){ state.part=2; state.step=0; }
  render();
};
document.getElementById('prevBtn').onclick = ()=>{
  if(state.step>0){ state.step--; }
  else if(state.part===2){ state.part=1; state.step=PARTS[1].length-1; }
  render();
};
document.getElementById('replayBtn').onclick = render;
document.getElementById('tab1').onclick = ()=>{state.part=1; state.step=0; render();};
document.getElementById('tab2').onclick = ()=>{state.part=2; state.step=0; render();};

/* ================= theme toggle ================= */
const themeBtn = document.getElementById('themeBtn');
/* mirrored half-tone glyphs: monochrome everywhere, unlike ☀/☾ which some platforms force to emoji */
function showTheme(){
  const dark = document.documentElement.dataset.theme==='dark';
  themeBtn.textContent = dark ? '◐' : '◑';
  themeBtn.title = dark ? 'Switch to light' : 'Switch to dark';
}
themeBtn.onclick = ()=>{
  const next = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem('tp-theme', next); }catch(e){}
  showTheme();
};
showTheme();

/* ================= PART 1 ================= */
const P1 = [];

/* ---- 1.1 the model ---- */
P1.push({
  title:'The model: Qwen3-235B-A22B (too big for one GPU)',
  text:`<h2>Why split at all?</h2>
    <p><b>235B parameters.</b> In BF16 (2 bytes each), that is ~<b>470 GB of weights</b>. An H100 GPU has 80 GB. The model physically cannot live on one GPU.</p>
    <p>So we take <b>4 GPUs</b> and give each one a piece. The core question: <b>which piece?</b></p>
    <div class="note"><b>Mental Model First:</b> Think of this as a standard dense transformer. We use Qwen's numbers because it is a real model that cannot fit on one card. (Production setups use Mixture-of-Experts, but weight matrix splitting follows the exact same logic.)</div>`,
  setup(body){
    const card = el('div','modelCard fadeIn');

const TOKS = [ {t:'"The"', id:785, v:E[0]}, {t:'"▁cat"', id:4415, v:E[1]}, {t:'"▁sat"', id:7139, v:E[2]} ];
const ghostCell = ()=>{ const g=el('div','cell small','⋯'); g.style.cssText+=';border:1px dashed var(--line);background:transparent;color:var(--dim);'; return g; };
function embTable(){
  const fill = id => Array.from({length:8},(_,c)=>((id*7 + c*13) % 9) - 4);
  const spec = [
    {id:0, v:fill(0), tok:'"!"'}, {id:1, v:fill(1), tok:'"and"'}, {gap:1},

  ];

  const head = el('div'); head.style.cssText='display:flex;align-items:center;gap:8px;padding:1px 4px;';

  const hg = el('div','caption','⋯ d4096'); hg.style.cssText+=';width:52px;text-align:center;';

  box.appendChild(head);

    const r = el('div'); r.style.cssText='display:flex;align-items:center;gap:8px;border-radius:2px;padding:1px 4px;';
    const tokl = el('div','caption', s.tok+' · '+s.id.toLocaleString('en-US')); tokl.style.cssText+=';min-width:120px;text-align:right;';
    r.appendChild(tokl);

P2.push({
  title:'Baseline: ONE GPU computes the full 3x8 block · W (192 multiply-adds)',
  text:`<h2>The full-size matmul: All tokens at once</h2>

/* ---- 2.7 AllReduce ---- */
P2.push({
  title:'AllReduce: Summing partial matrices across all GPUs',
  text:`<h2>Step 2 of Row Parallelism: AllReduce</h2>
    <p>Because each GPU produced an incomplete partial sum for each prompt token, joining them requires <b>element-wise addition</b>.</p>
    <p><b>AllReduce</b> pools the 3x8 partial matrices from all 4 GPUs, adds them element-wise across NVLink interconnect wires, and leaves the completed 3x8 matrix on every GPU.</p>

  setup(body, id){

/* ---- 2.8 chaining two multiplications ---- */
P2.push({
  title:'Chaining Two Multiplications: Zero communication until the end',
  text:`<h2>Two steps of math, only ONE network sync</h2>
    <p>Inside every transformer layer, there are two matrix multiplications back-to-back (expanding the token vector, then shrinking it back).</p>
    <p>If GPUs had to stop and exchange data over cables after every single multiplication, the network would become an enormous bottleneck.</p>
    <p><b>The smart combination:</b></p>
    <p>1. <b>First math step (Column Cut):</b> GPU 0 computes columns 0-1 and keeps them in its local on-chip cache.</p>
    <p>2. <b>Second math step (Row Cut):</b> GPU 0's row shard only requires columns 0-1! It consumes its own local data directly without any network transfer.</p>
    <div class="key"><b>The payoff:</b> Two full matrix multiplications run at full speed with <b>zero intermediate communication</b>. The GPUs talk over NVLink cables only once at the end using <b>one AllReduce</b>.</div>`,
  setup(body, id){
    const flowWrap = el('div','col'); flowWrap.style.gap='16px'; flowWrap.style.width='100%'; flowWrap.style.maxWidth='860px';

    const status = el('div','statusBadge','1. All 4 GPUs compute column multiplication in parallel');
    flowWrap.appendChild(status);

    const stage1 = el('div','row'); stage1.style.gap='12px';
    const gpuCards = [];

    for(let g=0;g<4;g++){
      const inner = el('div','col'); inner.style.gap='8px';
      
      const c1 = el('div','chip',`1. Column Math<br><small style="color:var(--dim)">makes cols ${2*g}-${2*g+1}</small>`);
      inner.appendChild(c1);
      
      const conn = el('div','tag','↓ local on-chip memory (0 network transfer) ↓');
      conn.style.fontSize = '9px';
      inner.appendChild(conn);
      
      const c2 = el('div','chip',`2. Row Math<br><small style="color:var(--dim)">uses cols ${2*g}-${2*g+1}</small>`);
      inner.appendChild(c2);
      
      const box = gpuBox(g, inner);
      stage1.appendChild(box);
      gpuCards.push({box, c1, conn, c2, g});
    }
    flowWrap.appendChild(stage1);

    const commCol = el('div','col'); commCol.style.width='100%'; commCol.style.alignItems='center'; commCol.style.marginTop='6px';
    commCol.appendChild(el('div','caption','interconnect cables (NVLink ~900 GB/s)'));
    const commWire = el('div');
    commWire.style.cssText = 'width:100%;max-width:680px;height:6px;background:var(--line2);border-radius:3px;position:relative;overflow:hidden;margin:4px 0;';
    const pulse = el('div');
    pulse.style.cssText = 'height:100%;width:0%;background:linear-gradient(90deg,var(--g0),var(--g1),var(--g2),var(--g3));transition:width 1.2s ease;';
    commWire.appendChild(pulse);
    commCol.appendChild(commWire);

    const syncTag = el('div','tag','ONE AllReduce Sync at the end of the block');
    syncTag.style.cssText += ';font-size:11.5px;padding:6px 16px;background:var(--panel);border:1px solid var(--line2);color:var(--text);';
    commCol.appendChild(syncTag);
    commCol.appendChild(el('div','caption','all 4 GPUs exchange partial sums once -> ready for next layer'));
    flowWrap.appendChild(commCol);

    body.appendChild(flowWrap);
    body.appendChild(el('div','bigNote','By pairing <b>Column Cut -> Row Cut</b>, activations never leave the GPU between multiplications. Two large math operations require only <b>one sync point</b> over NVLink.'));

    (async()=>{
      await sleep(500); if(!alive(id)) return;
      
      // Phase 1: Column Math
      status.textContent = '1. Step 1: All 4 GPUs compute column multiplication in parallel';
      status.classList.add('active');
      gpuCards.forEach(gc=>{
        gc.c1.style.background = GT[gc.g];
        gc.c1.style.borderColor = GC[gc.g];
        gc.c1.style.color = GC[gc.g];
        gc.c1.classList.add('flash');
      });
      await sleep(1400); if(!alive(id)) return;

      // Phase 2: Local Memory Transfer (0 Network)
      status.textContent = '2. Local Memory: Outputs feed directly into next step (0 network cables used)';
      gpuCards.forEach(gc=>{
        gc.conn.style.background = 'var(--okWash)';
        gc.conn.style.borderColor = 'var(--ok)';
        gc.conn.style.color = 'var(--ok)';
        gc.conn.classList.add('flash');
      });
      await sleep(1400); if(!alive(id)) return;

      // Phase 3: Row Math
      status.textContent = '3. Step 2: All 4 GPUs compute row multiplication in parallel';
      gpuCards.forEach(gc=>{
        gc.c2.style.background = GT[gc.g];
        gc.c2.style.borderColor = GC[gc.g];
        gc.c2.style.color = GC[gc.g];
        gc.c2.classList.add('flash');
      });
      await sleep(1400); if(!alive(id)) return;

      // Phase 4: AllReduce Sync
      status.textContent = '4. Single Sync: GPUs exchange and sum partial answers over NVLink cables';
      pulse.style.width = '100%';
      syncTag.style.background = INK;
      syncTag.style.color = ONINK;
      syncTag.style.borderColor = INK;
      syncTag.classList.add('flash');
      await sleep(1500); if(!alive(id)) return;

      // Complete
      status.textContent = 'Complete: Two full matrix multiplications done with only ONE sync point';
      status.classList.remove('active');
    })();
  }
});

P2.push({
  title:'Prefill drumbeat: 94 layers of parallel compute and sync',
  text:`<h2>The full forward pass</h2>

  setup(body, id){

      const gcells=[];
      for(let g=0;g<4;g++){
        const c = el('div','layerCell'); c.style.cssText+=`background:${GT[g]};border:1px solid ${GB[g]};`;
        r.appendChild(c); gcells.push(c);
      }
      const sync = el('div','tag','AllReduce'); sync.style.transition='all .25s';
      r.appendChild(sync);
      wrap.appendChild(r);
      rows.push({gcells, sync});
    }
    wrap.appendChild(el('div','caption','⋮ continues to layer 94 ⋮'));
    chain.appendChild(wrap);
    body.appendChild(chain);
    const out = el('div','col'); out.style.marginTop='14px';
    const tok = el('div','tokOut','first token -> "Sure"');
    out.appendChild(tok);
    body.appendChild(out);
    (async()=>{
      await sleep(400);
      for(let l=0;l<8;l++){
        if(!alive(id)) return;
        rows[l].gcells.forEach((c,g)=>{ c.style.boxShadow=`3px 3px 0 -1px ${GC[g]}`; c.style.borderColor=GC[g]; });
        await sleep(420); if(!alive(id)) return;
        rows[l].gcells.forEach(c=>{ c.style.boxShadow='none'; });
        rows[l].sync.style.background=INK; rows[l].sync.style.color=ONINK; rows[l].sync.style.borderColor=INK;
        await sleep(200); if(!alive(id)) return;
        rows[l].sync.style.background=''; rows[l].sync.style.color=''; rows[l].sync.style.borderColor='';
      }
      if(!alive(id)) return;
      tok.style.opacity='1';
    })();
  }
});

/* ---- 2.10 TTFT race ---- */
P2.push({
  title:'The payoff: Time-to-first-token, 1 GPU vs 4 GPUs',
  text:`<h2>Race through 94 layers</h2>
    <p>Per layer (per weight matrix, per token): 1 GPU pays <b>4 units of math</b>. 4 GPUs pay <b>1 unit of math + ~0.25 units of AllReduce tax</b>.</p>
    <p>Over 94 layers: 376 units vs ~117 units -> <b>~3.2x faster to the first token</b> (not 4x due to communication cost, visible as ochre slivers).</p>
    <div class="key"><b>The complete mental model:</b><br>
      1. <b>Sharding:</b> Every weight matrix is sliced into blocks across all GPUs (1/4 of every layer per GPU).<br>
      2. <b>Parallel Math:</b> Each GPU computes a 1/4-size matmul: wall-clock speedup.<br>
      3. <b>Column vs Row:</b> Column-split shards <i>concatenate</i> (AllGather); row-split shards <i>sum</i> (AllReduce). Combining Col -> Row needs only 1 AllReduce per block.<br>
      4. <b>Hardware Reality:</b> Interconnect wires (NVLink) add a small communication overhead, yielding ~3.2x real-world speedup on 4 GPUs.</div>
    <div class="note">Caveat kept honest: this model is MoE, so its FFN experts are usually split by expert parallelism in production, attention by tensor parallelism. And 470 GB BF16 needs H200 cards or FP8. Neither changes the logic you just watched.</div>`,
  setup(body, id){
    const wrap = el('div','col'); wrap.style.gap='26px';
    function lane(label, colorHtml){
      const c = el('div','raceLane');
      c.appendChild(el('div','caption',label)).style.textAlign='left';
      const t = el('div','raceTrack');
      c.appendChild(t);
      const timer = el('div','counter','elapsed: <b>0</b> units');
      c.appendChild(timer);
      const tok = el('div','tokOut','FIRST TOKEN ✓'); tok.style.marginTop='6px';
      c.appendChild(tok);
      return {c, t, timer, tok};
    }
    const l1 = lane('1 GPU: full-size matmuls, no communication');
    const l4 = lane('4 GPUs: 1/4-size matmuls (teal) + AllReduce tax (ochre)');
    wrap.appendChild(l1.c); wrap.appendChild(l4.c);
    const f1 = el('div','raceFill'); f1.style.background='var(--accent)'; l1.t.appendChild(f1);
    const f4wrap = el('div'); f4wrap.style.cssText='display:flex;height:100%;width:0%;overflow:hidden;'; l4.t.appendChild(f4wrap);
    for(let i=0;i<20;i++){
      const m = el('div'); m.style.cssText='height:100%;flex:4;background:'+GC[0]+';';
      const a = el('div'); a.style.cssText='height:100%;flex:1;background:'+GC[1]+';';
      f4wrap.appendChild(m); f4wrap.appendChild(a);
    }
    const res = el('div','bigNote','');
    wrap.appendChild(res);
    body.appendChild(wrap);
    const T1=376, T4=117.5, DUR=6000;
    (async()=>{
      await sleep(500); if(!alive(id)) return;
      const t0 = performance.now();
      const iv = setInterval(()=>{
        if(!alive(id)){ clearInterval(iv); return; }
        const u = (performance.now()-t0) / (DUR/T1);
        const u1 = Math.min(u, T1), u4 = Math.min(u, T4);
        f1.style.width = (u1/T1*100)+'%';
        f4wrap.style.width = (u4/T4*100)+'%';
        l1.timer.innerHTML = `elapsed: <b>${Math.round(u1)}</b> units`;
        l4.timer.innerHTML = `elapsed: <b>${Math.round(u4)}</b> units` + (u4>=T4?' (done)':'');
        if(u4>=T4) l4.tok.style.opacity='1';
        if(u1>=T1){ l1.tok.style.opacity='1'; clearInterval(iv);
          res.innerHTML = `TTFT: <b>376 units -> 117.5 units</b> = <b>3.2x faster</b>. Not 4x: the ochre AllReduce tax is real. Bigger prompts amortize it better; slower interconnects (PCIe vs NVLink) make it worse.`;
        }
      }, 40);
    })();
  }
});

const PARTS = {1:P1, 2:P2};
render();
</script>
